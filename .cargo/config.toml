[env]
# Link libstdc++ statically into Windows (MinGW) builds, so C++ dependencies such as OCCT
# (cadrs_kernel feature "occt") don't need libstdc++-6.dll next to the exe.
CXXSTDLIB_x86_64_pc_windows_gnu = "static:-bundle=stdc++"
# OCCT's CMakeLists declares cmake_minimum_required < 3.5, which CMake 4 rejects without this.
CMAKE_POLICY_VERSION_MINIMUM = "3.5"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold", "-Zshare-generics=y", "-Zthreads=8"]

[alias]
# Builds in release and installs it for the current user, with a launcher entry (Linux; see
# crates/cadrs/src/install.rs).
install-local = "run -r -p cadrs -- --install"
