[package]
name = "cadrs-site"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"

# Its own workspace: the site is not part of the cadrs app's.
[workspace]

[dependencies]
anyhow = "1"
axum = "0.7.9"
dotenvy = "0.15"
# Platform, theme, heart and GitHub icons from 0.4.3, which is on GitHub but not yet on crates.io.
icon-rs = { git = "https://github.com/rvdende/icon-rs", rev = "64faae90ed0f12b698f536fcd8f4b6c016dfbac8" }
proa_core = { version = "0.3.0" }
proa_fonts = { version = "0.1.0", features = ["render"] }
proa_fonts_macros = { version = "0.1.0" }
proa_framework_axum = { version = "0.3.0" }
proa_macros = { version = "0.3.0" }
proa_stream = { version = "0.3.0" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
const_format = { version = "0.2" }
heapless = { version = "0.8" }
proa_actions = { git = "https://github.com/Proa-Labs/proa.git" }
proa_ir = { git = "https://github.com/Proa-Labs/proa.git" }
serde_json = { version = "1.0" }
strum = { version = "0.27.2", features = ["derive"] }
strum_macros = { version = "0.27.2" }

[build-dependencies]
proa_fonts_build = { version = "0.1.0" }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1

# Static export (`proa export`) is on our Proa fork until it lands upstream. Every Proa crate
# comes from the fork, so the graph has one copy of each.
[patch.crates-io]
itoa_lut = { git = "https://github.com/rvdende/proa", branch = "feat/static-export" }
proa_core = { git = "https://github.com/rvdende/proa", branch = "feat/static-export" }
proa_dsl = { git = "https://github.com/rvdende/proa", branch = "feat/static-export" }
proa_framework_axum = { git = "https://github.com/rvdende/proa", branch = "feat/static-export" }
proa_framework_core = { git = "https://github.com/rvdende/proa", branch = "feat/static-export" }
proa_macros = { git = "https://github.com/rvdende/proa", branch = "feat/static-export" }
proa_react = { git = "https://github.com/rvdende/proa", branch = "feat/static-export" }
proa_stream = { git = "https://github.com/rvdende/proa", branch = "feat/static-export" }
rsjs = { git = "https://github.com/rvdende/proa", branch = "feat/static-export" }
rsjs_ir = { git = "https://github.com/rvdende/proa", branch = "feat/static-export" }
rsjs_macros = { git = "https://github.com/rvdende/proa", branch = "feat/static-export" }
rsjs_transport = { git = "https://github.com/rvdende/proa", branch = "feat/static-export" }
rsjs_web = { git = "https://github.com/rvdende/proa", branch = "feat/static-export" }
proa_fonts = { git = "https://github.com/rvdende/proa", branch = "feat/static-export" }
proa_fonts_build = { git = "https://github.com/rvdende/proa", branch = "feat/static-export" }
proa_fonts_macros = { git = "https://github.com/rvdende/proa", branch = "feat/static-export" }
proa_fonts_parse = { git = "https://github.com/rvdende/proa", branch = "feat/static-export" }

# md_sync! emits cfg(rust_analyzer).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_analyzer)"] }
