name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep the cached target folder small: no incremental state, less debug info.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  test:
    name: Build and test (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ pkg-config clang mold \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      # The nightly pinned in rust-toolchain.toml (.cargo/config.toml links with mold and uses a
      # nightly flag).
      - name: Rust toolchain
        run: rustup toolchain install && rustc -V

      # OpenCASCADE is built from source on the first run (several minutes); the cache keeps it.
      - uses: Swatinem/rust-cache@v2

      # occt-sys installs OpenCASCADE in target/debug/OCCT, which rust-cache deletes when it saves
      # (it keeps only build, deps and .fingerprint), while the cached opencascade-sys build script
      # stays fresh and never rebuilds it: a cache hit then has no OCCT headers or libraries. This
      # step caches that folder on its own. It must come after rust-cache: post steps run in
      # reverse order, so it saves before rust-cache's cleanup deletes the folder.
      - name: OpenCASCADE revision
        id: occt
        shell: bash
        run: |
          rev=$(grep -A2 '^name = "occt-sys"' Cargo.lock | sed -n 's/^source = ".*#\([0-9a-f]*\)"$/\1/p')
          test -n "$rev"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
      - name: OpenCASCADE cache
        uses: actions/cache@v4
        with:
          path: target/debug/OCCT
          key: occt-${{ runner.os }}-${{ runner.arch }}-${{ steps.occt.outputs.rev }}
      # A restored target folder without OCCT (a cache saved before this step existed, or an
      # evicted OpenCASCADE cache): make cargo run opencascade-sys's build script again, which
      # rebuilds OCCT.
      - name: Rebuild OpenCASCADE if a cache lost it
        shell: bash
        run: |
          if [ -d target/debug/.fingerprint ] && [ ! -e target/debug/OCCT/include/Standard.hxx ]; then
            echo "target/debug/OCCT is missing: opencascade-sys will build it again"
            rm -rf target/debug/.fingerprint/opencascade-sys-*
          fi

      - name: Build
        run: cargo build --workspace

      # Unit tests only: each integration test (`crates/*/tests`) links Bevy and OpenCASCADE into
      # its own large binary, too much for a hosted runner's disk. Run them locally with
      # `cargo test --workspace`.
      - name: Test
        run: cargo test --workspace --exclude cadrs --lib

  macos:
    name: Build and test (macOS)
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: brew install cmake

      - name: Rust toolchain
        run: rustup toolchain install && rustc -V

      - uses: Swatinem/rust-cache@v2

      # See the Linux job.
      - name: OpenCASCADE revision
        id: occt
        shell: bash
        run: |
          rev=$(grep -A2 '^name = "occt-sys"' Cargo.lock | sed -n 's/^source = ".*#\([0-9a-f]*\)"$/\1/p')
          test -n "$rev"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
      - name: OpenCASCADE cache
        uses: actions/cache@v4
        with:
          path: target/debug/OCCT
          key: occt-${{ runner.os }}-${{ runner.arch }}-${{ steps.occt.outputs.rev }}
      # A restored target folder without OCCT (a cache saved before this step existed, or an
      # evicted OpenCASCADE cache): make cargo run opencascade-sys's build script again, which
      # rebuilds OCCT.
      - name: Rebuild OpenCASCADE if a cache lost it
        shell: bash
        run: |
          if [ -d target/debug/.fingerprint ] && [ ! -e target/debug/OCCT/include/Standard.hxx ]; then
            echo "target/debug/OCCT is missing: opencascade-sys will build it again"
            rm -rf target/debug/.fingerprint/opencascade-sys-*
          fi

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace --exclude cadrs --lib
